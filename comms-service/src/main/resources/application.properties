spring.application.name=comms-service

server.port=8084

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.orders.exchange=${ORDERS_EXCHANGE:relatos.orders.exchange}
app.rabbitmq.orders.created-routing-key=${ORDERS_CREATED_ROUTING_KEY:orders.created}
app.rabbitmq.orders.created-queue=${ORDERS_CREATED_QUEUE:relatos.orders.created.queue}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@relatos.com}
app.mail.host=${MAIL_HOST:localhost}
app.mail.port=${MAIL_PORT:25}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.smtp-auth=${MAIL_SMTP_AUTH:false}
app.mail.starttls=${MAIL_SMTP_STARTTLS:false}
