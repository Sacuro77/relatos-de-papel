spring.application.name=orders-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5434/orders_db
spring.datasource.username=orders_user
spring.datasource.password=orders_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=health,info

app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-activity-3-relatos-de-papel-32bytes}
app.jwt.issuer=${JWT_ISSUER:relatos-de-papel-users-service}
app.security.access-token-header=accessToken

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.orders.exchange=${ORDERS_EXCHANGE:relatos.orders.exchange}
app.rabbitmq.orders.created-routing-key=${ORDERS_CREATED_ROUTING_KEY:orders.created}
app.rabbitmq.orders.created-queue=${ORDERS_CREATED_QUEUE:relatos.orders.created.queue}
